[package]
name = "tenth"
version = "0.3.3"
edition = "2024"
description = "Tenth language bootstrap compiler"

[features]
# Enable memory tracking counters and hard-limit enforcement.
# Adds ~2% overhead from atomic operations.
mem-debug = []
# Strict mode: panics on limit violations instead of soft warnings.
# Implies mem-debug.
mem-strict = ["mem-debug"]

[dependencies]
ndarray = "0.16"
rustyline = "15"
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
wasm-encoder = "0.215"
wasmi = "0.39"
cranelift = "0.115"
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-native = "0.115"
