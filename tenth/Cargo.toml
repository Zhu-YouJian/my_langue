[package]
name = "tenth"
version = "1.0.0"
edition = "2024"
description = "Tenth language bootstrap compiler"

[features]
# Enable memory tracking counters and hard-limit enforcement.
# Adds ~2% overhead from atomic operations.
mem-debug = []
# Strict mode: panics on limit violations instead of soft warnings.
# Implies mem-debug.
mem-strict = ["mem-debug"]

[dependencies]
ndarray = "0.16"
rustyline = "15"
thiserror = "2"
rand = "0.8"
rand_distr = "0.4"
wasm-encoder = "0.215"
wasmi = "0.39"
wasmtime = "46.0.1"
cranelift = "0.115"
cranelift-module = "0.115"
cranelift-jit = "0.115"
cranelift-native = "0.115"
regex = "1"
# Wave 2：f16/bf16 半精度浮点支持（TensorData::F16/BF16）
half = "2"

# B批：编码工具（Unicode 规范化、Base64、百分比编码）
unicode-normalization = "0.1"
base64 = "0.22"
percent-encoding = "2"
encoding_rs = "0.8"

# 哈希函数（SHA-256/SHA-512/MD5）
sha2 = "0.10"
md-5 = "0.10"

[profile.release]
# 安全：启用算术溢出检查，让 hostcalls.rs / wasm/wasmtime_host.rs 中的
# `count * 2` / `rows * cols` 等运算在溢出时 panic 而非静默回绕。
# 对运行时性能影响极小（<2%），但显著降低被构造输入触发 UB 的风险。
overflow-checks = true
# 保留 unwind 能力，让 JIT hostcall 内部的 catch_unwind 能正常工作。
# 若未来想缩小 JIT 攻击面可改 "abort"，但需评估对所有 catch_unwind 的影响。
panic = "unwind"

[profile.dev]
overflow-checks = true
